[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbird-gitops"
dynamic = ["version"]
description = "Declarative NetBird access control reconciled from Git"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/hatemmezlini/netbird-gitops"

[project.scripts]
netbird-gitops = "netbird_gitops.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "netbird_gitops.__version__" }
