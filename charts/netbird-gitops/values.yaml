# -- Reconciler image.
image:
  repository: ghcr.io/hatemmezlini/netbird-gitops
  # Defaults to the chart appVersion.
  tag: ""
  # Optional, e.g. sha256:...; takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

netbird:
  # Management API base URL, as reached from the cluster (without /api), e.g.
  # http://netbird-server.netbird.svc.cluster.local or https://netbird.example.com
  apiUrl: ""
  # Secret holding a personal access token of an ADMIN SERVICE USER (never a person).
  tokenSecret:
    name: ""
    key: token

reconciler:
  enabled: true
  schedule: "*/5 * * * *"
  # true: the job only prints its plan (kubectl logs). Read it once, then set false.
  dryRun: true
  suspend: false
  activeDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Desired NetBird state. Reference: README.md "Configuration".
config:
  # Disable every enabled policy not managed here (they are disabled, never deleted), and
  # delete managed objects that are no longer declared.
  strict: true
  # Disable any All -> All policy (NetBird's "Default" policy connects every peer).
  disableAllToAll: true
  # Partial account settings, merged into the current ones (NetBird AccountSettings).
  settings: {}
  #   regular_users_view_blocked: true
  #   groups_propagation_enabled: true
  #   extra:
  #     user_approval_required: true
  # Members of this group get the console role `admin`, other user groups `user`.
  adminsGroup: ""
  # Groups of people. Created if missing, never deleted. Every group listed here can
  # open the portal.
  userGroups: []
  # null: group membership is managed in the NetBird console.
  # A map: Git owns membership of userGroups (e-mail -> groups). In strict mode, users not
  # listed lose their user groups. Listed users pending approval are approved.
  users: null
  approveListedUsers: true
  # The network whose routing peer serves the tools. The router group is usually the
  # auto-group of the routing peer's setup key.
  network:
    name: ""
    description: ""
    routerGroup: ""
    masquerade: true
    metric: 9999
  # Exit with an error (failed Job) when no routing peer is connected.
  checkRouterOnline: true
  # Each tool: a network resource, reachable by its groups on its ports, and a portal card.
  tools: []
  # - name: grafana                      # lowercase, digits, dashes
  #   title: Grafana
  #   description: Dashboards and alerting
  #   address: grafana.vpn.example.com   # domain, *.domain, IP or CIDR
  #   url: https://grafana.vpn.example.com  # default: https://<address> for a domain on 443
  #   icon: chart                         # see README.md for the list
  #   groups: [platform-admins, developers]
  #   protocol: tcp                       # tcp, udp, icmp, all
  #   ports: [443]
  #   portal: true                        # false: access only, no card

portal:
  enabled: true
  # Host name users open through the VPN. It becomes a network resource reachable by every
  # user group on port 443. Leave empty to manage access to the portal yourself.
  address: ""
  title: Internal tools
  subtitle: Reachable through the NetBird VPN. What you can open depends on your groups.
  lang: en
  # Per-tool reachability probe timeout, in milliseconds.
  checkTimeoutMs: 4000
  text:
    groups: Groups
    address: Address
    unknown: Not checked
    checking: Checking…
    reachable: Reachable
    blocked: Not reachable
    noUrl: Use a client for this address
    summaryChecking: "Checking {total} tools…"
    summary: "{reachable} of {total} tools reachable from this device."
    summaryNoScript: Enable JavaScript to check which tools you can reach.
    recheck: Check again
    empty: No tools are declared yet.
    footer: Generated by netbird-gitops from the access configuration in Git.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.7-alpine
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80
  # Optional Ingress (only on an ingress controller reachable from the VPN).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
