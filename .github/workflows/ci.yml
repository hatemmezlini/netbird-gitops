name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5
      - name: Lint
        run: |
          helm lint charts/netbird-gitops -f examples/values.yaml -f examples/access.yaml
          node --check charts/netbird-gitops/files/portal.js
      - name: The rendered configuration is valid
        run: |
          pip install --quiet pyyaml
          helm template nb charts/netbird-gitops -f examples/values.yaml -f examples/access.yaml --show-only templates/reconciler.yaml \
            | python -c 'import sys, yaml; d = next(x for x in yaml.safe_load_all(sys.stdin) if x["kind"] == "ConfigMap"); open("config.json", "w").write(d["data"]["config.json"])'
          PYTHONPATH=src python -m netbird_gitops --validate --config config.json
      - name: Mistakes are rejected at install time
        run: |
          printf 'resources:\n  postgres:\n    address: db.vpn.example.com\n    port: 5432\n' > typo.yaml
          printf 'access:\n  developers: [argocd, grafna]\n' > unknown.yaml
          for f in typo.yaml unknown.yaml; do
            if helm template nb charts/netbird-gitops -f examples/values.yaml -f examples/access.yaml -f "$f" > /dev/null 2>&1; then
              echo "$f was accepted"; exit 1
            fi
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: netbird-gitops:ci
      - name: Smoke test
        run: docker run --rm netbird-gitops:ci --version
