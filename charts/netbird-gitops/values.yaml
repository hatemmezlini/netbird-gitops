# yaml-language-server: $schema=values.schema.json
#
# The first four sections describe access and are what you edit most. They can live in a
# file of their own (helm ... -f values.yaml -f access.yaml). Unknown keys are rejected.

# -- Who can reach what. Keys are groups of people (created in NetBird if missing, never
# deleted); values are resource names, or ["*"] for every resource. Every group listed
# here can also open the portal.
access: {}
#  platform-admins: ["*"]
#  developers: [argocd, grafana]
#  viewers: [grafana]

# -- What can be reached. Keys are resource names (lowercase letters, digits, dashes).
resources: {}
#  grafana:
#    address: grafana.vpn.example.com   # domain, *.domain, IP or CIDR
#    title: Grafana                     # portal card; default: the name
#    description: Dashboards and alerting
#    icon: chart                        # see README.md for the list
#    protocol: tcp                      # tcp (default), udp, icmp, all
#    ports: [443]                       # default [443]; none for icmp and all
#    url: https://grafana.vpn.example.com/   # card link; default https://<address> on 443
#    probe: https://grafana.vpn.example.com/api/health   # URL the portal checks; optional
#    showInPortal: true                 # false: access only, no card

# -- Who is in which group. Leave null to manage membership in the NetBird console.
# When set, Git owns membership of the groups in `access`: listed people get exactly their
# groups (and are approved if pending); in strict mode, people not listed lose them.
members: null
#  alice@example.com: [platform-admins]
#  bob@example.com: [developers]

# -- Group whose members get the NetBird console role "admin"; members of the other
# groups get "user". Empty: console roles are not managed.
consoleAdmins: ""

# -- NetBird account settings. Unset values are left as they are.
account:
  # Changes of a person's groups reach the devices they already enrolled. The access model
  # relies on it.
  groupsPropagation: true
  # restrictRegularUsers: true      # regular users only see their own devices in the console
  # userApproval: true              # a new account needs approval (approved here if in members)
  # peerApproval: false
  # peerLoginExpiration: 48h        # duration (s, m, h, d) or false
  # peerInactivityExpiration: false
  # Any other AccountSettings field, with its NetBird API name.
  raw: {}

# -- The NetBird network that holds the resources, and its routing peers.
network:
  name: ""
  description: ""
  # Group of the routing peers, usually the auto-assigned group of their setup key.
  routerGroup: ""
  masquerade: true
  metric: 9999

netbird:
  # Management API base URL, as reached from the cluster (without /api), e.g.
  # http://netbird-server.netbird.svc.cluster.local or https://netbird.example.com
  apiUrl: ""
  # Secret holding a personal access token of an ADMIN SERVICE USER (never a person).
  tokenSecret:
    name: ""
    key: token

reconciler:
  enabled: true
  schedule: "*/5 * * * *"
  # true: the job only prints its plan (kubectl logs). Read it once, then set false.
  dryRun: true
  # Disable every enabled policy not managed here (disabled, never deleted), and delete
  # managed objects that are no longer declared.
  strict: true
  # Disable All -> All policies (NetBird's "Default" policy connects every device).
  disableAllToAll: true
  # Approve people listed in `members` who are pending approval.
  approveMembers: true
  # Fail the job when no routing peer is connected.
  checkRouterOnline: true
  suspend: false
  activeDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

image:
  repository: ghcr.io/hatemmezlini/netbird-gitops
  # Defaults to the chart appVersion.
  tag: ""
  # Optional, e.g. sha256:...; takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

portal:
  enabled: true
  # Host name people open through the VPN. It becomes a resource reachable by every group
  # in `access`, on port 443. Leave empty to manage access to the portal yourself.
  address: ""
  title: Internal tools
  subtitle: The tools your groups give you access to through NetBird, from this device.
  lang: en
  # Logo shown in the header: inline SVG markup (trusted, from your values). Use your
  # own logo; a third-party logo needs its owner's permission.
  logo:
    svg: ""
    alt: ""
  # inter: Inter, bundled with the chart (no external request). system: system fonts.
  font: inter
  # The page checks every resource from the browser and only shows those that answer.
  # A resource the person's groups do not grant times out: keep this above the latency
  # of a granted one.
  checkTimeoutMs: 4000
  text:
    searchLabel: Search tools
    searchPlaceholder: Name, description or address
    checking: Checking your access…
    available: "{count} tools available"
    availableOne: 1 tool available
    matching: "{shown} of {count} tools match"
    noneTitle: No tools available from this device
    noneBody: Check that NetBird is connected, then check again. If you should have access, ask a platform admin to add you to a group.
    noMatchTitle: No tool matches
    noMatchBody: Search by name, description or address.
    clear: Clear search
    recheck: Check again
    copy: Copy address of
    copied: "{address} copied"
    noScript: JavaScript is off, so access cannot be checked. Every tool is listed.
    footer: Access is checked from this device through NetBird. Generated by netbird-gitops from Git.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.7-alpine
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80
  # Optional Ingress (only on an ingress controller reachable from the VPN).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
