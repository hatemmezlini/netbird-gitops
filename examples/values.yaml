# yaml-language-server: $schema=https://raw.githubusercontent.com/hatemmezlini/netbird-gitops/v0.1.0/charts/netbird-gitops/values.schema.json
#
# Deployment of netbird-gitops next to a self-hosted NetBird whose routing peer runs in the
# cluster. Access itself is in access.yaml.
#   helm install netbird-gitops oci://ghcr.io/hatemmezlini/charts/netbird-gitops \
#     --version 0.1.0 -n netbird -f values.yaml -f access.yaml

netbird:
  apiUrl: http://netbird-server.netbird.svc.cluster.local
  tokenSecret:
    name: netbird-admin-pat
    key: token

network:
  name: production
  description: Production cluster
  routerGroup: k8s-routers

account:
  groupsPropagation: true
  restrictRegularUsers: true
  userApproval: true
  peerLoginExpiration: 48h

reconciler:
  dryRun: true      # read the plan first, then set false

portal:
  address: portal.vpn.example.com
